workflows:
  android-release:
    name: Android Release Build
    instance_type: linux_x2
    max_build_duration: 120
    
    environment:
      java: 17
      flutter: 3.41.6
      
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
          - develop
          - release/*
      tag:
        include_patterns:
          - v*

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build APK (Debug)
        script: |
          flutter build apk --debug

      - name: Build APK (Release)
        script: |
          flutter build apk --release

      - name: Build App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - $DEVELOPER_EMAIL
        notify:
          success: true
          failure: true

  android-debug:
    name: Android Debug Build
    instance_type: linux_x2
    max_build_duration: 60
    
    environment:
      java: 17
      flutter: 3.41.6
      
    triggering:
      events:
        - pull_request
      branch:
        include_patterns:
          - develop

    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Build APK (Debug)
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - $DEVELOPER_EMAIL
        notify:
          success: true
          failure: true
