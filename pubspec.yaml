name: poster_pro
description: "ناشر برو - Poster Pro. تطبيق نشر تلقائي على مجموعات فيسبوك."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  webview_flutter: ^4.4.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  uuid: ^4.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
    - assets/images/splash-icon.png
    - assets/images/favicon.png